server:
  port: 8080

spring:
  application:
    name: demo-app
  # Compose service names: the demo runs entirely inside docker compose and never reaches host
  # services. Overridable by env: SPRING_RABBITMQ_HOST, SPRING_DATA_REDIS_HOST.
  rabbitmq:
    host: rabbitmq
    port: 5672
  data:
    redis:
      host: redis
      port: 6379

traction:
  control-plane:
    enabled: true   # this service is also the control plane: admin API + dashboard at /traction

# The vendor simulator, by its compose service name (env ACME_BASE_URL overrides).
acme:
  base-url: http://acme-vendor:9090

logging:
  pattern:
    # Every flight's log lines carry its correlation and flight ids (MDC set by the consumer).
    level: "%5p [cid=%X{correlationId:--} flight=%X{flightId:--}]"
