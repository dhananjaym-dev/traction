name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and test
        run: ./gradlew build

      - name: Start the demo stack
        run: docker compose up -d --build --wait

      - name: Run the Traction scenario
        run: |
          set -o pipefail
          ./demo/scenario-traction.sh | tee scenario.log
          tail -n1 scenario.log | grep -qx 'OK scenario-traction'

      - name: Dump compose logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
