<!doctype html>
<html lang="en">
<head>
{% include "head.html" %}
</head>
<body class="essay">
<header class="essay-header">
  <a class="brand" href="{{ nav.homepage.url | url if nav and nav.homepage else base_url ~ '/' }}">{{ config.site_name }}</a>
  <nav aria-label="Links">
    {%- for item in nav %}{% if not item.is_homepage and loop.index == 2 %}
    <a href="{{ item.url | url }}">Docs</a>
    {%- endif %}{% endfor %}
    <a href="{{ config.repo_url }}">GitHub</a>
  </nav>
</header>
<article class="essay-body">
{{ page.content }}
</article>
</body>
</html>
