# Everything runs inside this compose network. AMQP (5672) and Redis (6379) are internal only and
# never published, so the demo can neither reach nor collide with a broker or store on the host.
# Published: demo-app :8080 (dashboard http://localhost:8080/traction), acme-vendor :9090, and the
# RabbitMQ management UI at http://localhost:15673 (guest/guest; RABBIT_MGMT_PORT overrides).
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "${RABBIT_MGMT_PORT:-15673}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

  redis:
    image: valkey/valkey:8
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  acme-vendor:
    build:
      context: .
      dockerfile: acme-vendor/Dockerfile
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9090/mode"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  demo-app:
    build:
      context: .
      dockerfile: demo-app/Dockerfile
    ports:
      - "8080:8080"   # dashboard at http://localhost:8080/traction
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
      ACME_BASE_URL: http://acme-vendor:9090
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      acme-vendor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/traction/api/airports"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 15s
